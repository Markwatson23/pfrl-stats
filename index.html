:root{--accent:#ff8a24;--panel:#171a21;--card:#12151b;--line:#303640;--muted:#a9b2c0}
body{background:radial-gradient(ellipse 80% 380px at 50% -140px,#123c2d 0%,transparent 85%),#0b0e13}
.brandmark{display:inline-flex;padding:6px 10px;margin-right:8px;border:1px solid #ff9b45;border-radius:7px;color:white;background:#166a48;letter-spacing:1px}
.top{padding:14px 0 8px;border-bottom:1px solid #333640}
.top h1{font-weight:850}
.tabs{position:sticky;top:0;z-index:4;padding:10px 0;background:#0b0e13eF;backdrop-filter:blur(10px)}
.tabs button:hover{border-color:#55eba2;color:#fff}
.tabs button.active{background:linear-gradient(120deg,#16784f,#ff8a24)}
.stat{position:relative;overflow:hidden;border-color:#343944}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#ff8a24}
.stat strong{font-variant-numeric:tabular-nums}
.panel{box-shadow:0 14px 40px #0002}
th{position:sticky;top:0;background:#20232b}
tr:hover td{background:#252932}
.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.metricbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:#101319}
.metricbox b{display:block;font-size:22px;margin:8px 0}
.progress{height:8px;background:#30343c;border-radius:20px;overflow:hidden;margin-top:9px}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,#1da36b,#ff962d);border-radius:20px}
.sectionlabel{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#6cf1aa;font-weight:800;margin:18px 0 10px}
.notice{border-left:3px solid #c99a4b;background:#33291855;padding:12px 15px;border-radius:5px;color:#e4cba0;font-size:12px;line-height:1.6}
.teamchip{font-weight:700}
@media(max-width:680px){.metricgrid{grid-template-columns:1fr}.top{align-items:flex-start}.tag{font-size:9px}.tabs{position:static}}

.hero{margin:0 0 20px;border:1px solid #353943;border-radius:18px;overflow:hidden;background:#0a0a10;box-shadow:0 18px 55px #0008}
.neon-banner{display:block;width:100%;height:auto;max-height:280px;object-fit:contain}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.overview-grid .panel{margin-top:0}
.overview-grid .tablewrap table{min-width:0}
.overview-grid th,.overview-grid td{padding:11px 7px;font-size:12px}
table th:not(:first-child),table td:not(:first-child){text-align:right}
table th:first-child,table td:first-child{text-align:left}
.overview-grid th:not(:first-child){text-align:right}
.overview-grid th:first-child,.overview-grid td:first-child{text-align:left}
.podium-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.podium-place{border:1px solid #383d49;border-radius:12px;padding:17px;background:linear-gradient(155deg,#242733,#11141b)}
.podium-place .rank{font-size:12px;color:#ffad5b;font-weight:800}
.podium-place strong{display:block;font-size:clamp(14px,2vw,22px);margin-top:10px;overflow-wrap:anywhere}
.podium-place small{color:#b1bac7}
.overview-action{background:none;border:0;padding:0;color:#6af0a6;cursor:pointer;font-weight:750}
.overview-action:hover{text-decoration:underline}
.overview-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.overview-grid .overview-head h2{margin:0;text-align:left}.overview-grid .overview-head .overview-action{margin-left:auto;flex-shrink:0}.panel>.overview-head{align-items:center}.panel>.overview-head h2{margin:0;text-align:left}.panel>.overview-head .overview-action{margin-left:auto}.metricbox{display:flex;flex-direction:column;justify-content:space-between;min-width:0}.metricbox b{overflow-wrap:anywhere;font-size:clamp(15px,2vw,22px)}
@media(max-width:750px){.overview-grid{grid-template-columns:1fr}.podium-grid{gap:7px}.podium-place{padding:10px}.neon-banner{max-height:180px}}

/* Linked archive pages */
.archive-link{color:#72efac;text-decoration:none;font-weight:750;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.archive-link:hover{text-decoration:underline}
.archive-heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.archive-heading h2{margin:0}
.archive-back{border:1px solid #424753;border-radius:9px;padding:9px 13px;background:#191d26;color:#fff;cursor:pointer}
.archive-hero{background:linear-gradient(125deg,#143a2c,#171a22 65%);border:1px solid #42404a;border-radius:18px;padding:22px;margin:15px 0}
.archive-hero h2{font-size:clamp(24px,4vw,38px);margin:8px 0}
.archive-hero p{color:#b7c0ce}
.archive-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.archive-cards>div{background:#11151b;border:1px solid #343b46;border-radius:12px;padding:15px;min-width:0}
.archive-cards small{display:block;color:#a9b2c0}
.archive-cards strong{display:block;font-size:20px;overflow-wrap:anywhere;margin-top:7px}
.archive-links{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.archive-links a{border:1px solid #55505b;padding:10px 14px;border-radius:9px;color:#7df0b0;text-decoration:none}
.archive-links a:hover{background:#193e2f}
@media(max-width:680px){.archive-cards{grid-template-columns:1fr 1fr}.archive-hero{padding:15px}}

/* PFRL official-inspired green / orange colour system */
:root{--accent:#ff8a24;--pfrl-green:#4de69a;--pfrl-orange:#ff8a24}
.tabs button.active{background:linear-gradient(115deg,#167b50,#219c62);border-color:#55eaa0;color:#fff}
.tabs button:hover,.archive-links a:hover{border-color:var(--pfrl-orange)}
.stat:before{background:linear-gradient(180deg,var(--pfrl-green),var(--pfrl-orange))}
.brand,.sectionlabel,.archive-link,.overview-action{color:var(--pfrl-green)}
.archive-hero{border-color:#276548;background:linear-gradient(125deg,#173e2e,#171a22 68%)}
.archive-links a{color:var(--pfrl-orange);border-color:#76532d}
.podium-place .rank{color:var(--pfrl-orange)}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pfrl-green);outline-offset:2px}

function updateDriverOptions(){
const previous=$('driver').value,season=$('season').value;
const available=season==='all'?driverNames:[...new Set(DB.results.filter(x=>x.season==season&&x.round!==0).map(x=>x.driver))].sort((a,b)=>a.localeCompare(b));
$('driver').innerHTML='<option value="all">Select a Driver</option>'+available.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
$('driver').value=available.includes(previous)?previous:'all';
}
updateDriverOptions();
$('circuit').innerHTML='<option value="all">All Circuits</option>'+circuits.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
const selected=()=>({s:$('season').value,d:$('driver').value,c:$('circuit').value});
function filt(a,{s,d,c},includePre=false){return a.filter(x=>(s==='all'||x.season==s)&&(c==='all'||x.event===c)&&(d==='all'||(x.driver??x.winner)===d)&&(includePre||x.round!==0))}
function getRaces(f){return filt(DB.races,{...f,d:'all'})}function getRows(f){return filt(DB.results,f)}
function metrics(rows,races,name){let r=rows.filter(x=>name==='all'||x.driver===name),rr=races.filter(x=>name==='all'||x.winner===name),poles=races.filter(x=>name==='all'||x.pole===name),dotd=races.filter(x=>name==='all'||x.dotd===name);return {starts:r.length,wins:rr.length,podiums:r.filter(x=>x.status==='Finished'&&x.position>=1&&x.position<=3).length,poles:poles.length,dotd:dotd.length,points:r.reduce((a,x)=>a+(Number(x.points)||0),0),dnf:r.filter(x=>x.status==='DNF').length,finish:r.filter(x=>x.status==='Finished'&&Number.isFinite(x.position)),qual:r.filter(x=>Number.isFinite(x.qual))}}

function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="num"':''}>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="muted">No recorded results for this selection.</td></tr>`}</tbody></table></div>`}

function raceHistory(rows){return table(['Season','Round','Circuit','Driver','Team','Qual','Grid','Finish','Status','Points'],rows.slice().sort((a,b)=>b.season-a.season||b.round-a.round||Number(a.position||999)-Number(b.position||999)).map(x=>[x.season,x.round,navLink(raceUrl(x),x.event),navLink(driverUrl(x.driver),x.driver),esc(x.team),x.qual??'—',x.grid??'—',x.position??'—',esc(x.status),x.points??'—']))}

function championship(f){
const rows=getRows({...f,d:'all'}),byDriver=new Map(),byTeam=new Map();
for(const r of rows){let p=Number(r.points)||0,team=normTeam(r.team);
if(!byDriver.has(r.driver))byDriver.set(r.driver,{name:r.driver,points:0,starts:0,wins:0,podiums:0});
let d=byDriver.get(r.driver);d.points+=p;d.starts++;d.wins+=r.status==='Finished'&&r.position===1?1:0;d.podiums+=r.status==='Finished'&&r.position<=3&&r.position>=1?1:0;

const drivers=ordered([...byDriver.values()],'points'),teams=ordered([...byTeam.values()],'points'),top=drivers[0]?.points||1;
return '<div class="notice">Provisional standings calculated from recorded race points. These are not certified championship totals: penalties, manual adjustments and scoring corrections may not be represented. All Time is a cumulative historical points ranking, not one championship.</div>'+

}

const circuits=[...new Set(rows.map(x=>x.event))].sort();
const form=rows.slice().sort((a,b)=>b.season-a.season||b.round-a.round).slice(0,5);

function render(){const f=selected(),races=getRaces(f),rows=getRows(f),m=metrics(rows,races,f.d),section=$('content');

}document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';

if(tab==='circuit'){if(f.c==='all'){out=`<div class="panel"><h2>Circuit History</h2><p>Select a circuit above to see its previous winners, poles and classifications.</p>${table(['Circuit','Races','Most recent season'],circuits.map(c=>{let rr=getRaces({...f,c});return [navLink(circuitUrl(c),c),rr.length,rr.length?Math.max(...rr.map(x=>x.season)):'—']}))}</div>`}else{out=`<div class="panel"><h2>${esc(f.c)} — Previous Races</h2>${table(['Season','Round','Winner','Pole','DOTD','Entries'],races.map(x=>[x.season,x.round,esc(x.winner),esc(x.pole),esc(x.dotd||'Not recorded'),x.entries]))}</div><div class="panel"><h2>Driver Records at ${esc(f.c)}</h2>${leaderboard(getRows({...f,d:'all'}),races)}</div><div class="panel"><h2>Full Results</h2>${raceHistory(getRows({...f,d:'all'}))}</div>`}}

if(tab==='race'){out=raceCentre(f)}
if(tab==='records'){out=`<div class="panel"><h2>All Driver Records</h2><p>Rankings based on the selected season and circuit.</p>${leaderboard(getRows({...f,d:'all'}),races)}</div><div class="panel"><h2>Race Results Archive</h2>${raceHistory(getRows({...f,d:'all'}))}</div>`}

section.querySelector('[data-back]')?.addEventListener('click',()=>{const kind=location.hash.slice(1).split('/')[0];history.pushState(null,'',location.pathname+location.search);tab=kind==='race'?'race':kind==='driver'?'driver':'circuit';render()});
section.querySelectorAll('[data-open-tab]').forEach(b=>b.addEventListener('click',()=>{history.replaceState(null,'',location.pathname+location.search);tab=b.dataset.openTab;render()}));if(tab==='race'){$('raceChoice')?.addEventListener('change',renderRaceDetail);renderRaceDetail()}if(tab==='compare'){function compare(){let a=$('compA').value,b=$('compB').value,ra=getRows({...f,d:'all'});let ma=metrics(ra,races,a),mb=metrics(ra,races,b);let shared=new Set(ra.filter(x=>x.driver===a).map(x=>x.season+'-'+x.round));let pair=ra.filter(x=>x.driver===b&&shared.has(x.season+'-'+x.round));let starts=new Set(pair.map(x=>x.season+'-'+x.round));let h2hA=ra.filter(x=>x.driver===a&&starts.has(x.season+'-'+x.round));let aQ=0,bQ=0,aF=0,bF=0;for(const x of h2hA){let y=pair.find(z=>z.season===x.season&&z.round===x.round);if(!y)continue;if(Number.isFinite(x.qual)&&Number.isFinite(y.qual)){if(x.qual<y.qual)aQ++;if(y.qual<x.qual)bQ++}if(Number.isFinite(x.position)&&Number.isFinite(y.position)&&x.status==='Finished'&&y.status==='Finished'){if(x.position<y.position)aF++;if(y.position<x.position)bF++}}$('comparison').innerHTML=table(['Metric',esc(a),esc(b)],[['Starts',ma.starts,mb.starts],['Wins',ma.wins,mb.wins],['Podiums',ma.podiums,mb.podiums],['Poles',ma.poles,mb.poles],['DOTD',ma.dotd,mb.dotd],['Points',fmt(ma.points),fmt(mb.points)],['Qualifying H2H (shared races)',aQ,bQ],['Finish H2H (both classified)',aF,bF]])} $('compA').addEventListener('change',compare);$('compB').addEventListener('change',compare);compare()}}
