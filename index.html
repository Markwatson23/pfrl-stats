function specialAchievements(rows,races,name){
const a=rows.slice().sort((x,y)=>x.season-y.season||x.round-y.round),byRace=new Map(races.map(x=>[raceId(x),x]));
const winsByCircuit=new Map(),unlocked=new Map();
const unlock=(id,x)=>{if(x&&!unlocked.has(id))unlocked.set(id,x)};
const run=(predicate,n)=>{let count=0;for(const x of a){count=predicate(x)?count+1:0;if(count>=n)return x}return null};
unlock('consistent',run(x=>validFinish(x)&&Number(x.points)>0,5));
unlock('clean',run(x=>x.status!=='DNF'&&validFinish(x),10));
unlock('hat',run(x=>validFinish(x)&&x.position===1,3));
unlock('survivor',run(validFinish,5));
unlock('fiver',run(x=>x.status!=='DNF'&&validFinish(x),5));
const finished=[],qualifying=[];let gains=0,topten=0,topqual=0,finishes=0,prev=null;
for(const x of a){
const r=byRace.get(raceId(x)),sameRace=DB.results.filter(y=>raceId(y)===raceId(x));
if(validFinish(x)){
finishes++;
if(finishes===20)unlock('steady',x);
if(x.position<=10&&++topten===10)unlock('topten',x);
if(Number(x.points)>0)unlock('point',x);
if(validGrid(x)){
const gain=x.grid-x.position;
if(gain>=10)unlock('comeback',x);
if(gain>0&&++gains===5)unlock('gainer',x);
if(x.grid>=15&&x.position<=10)unlock('backmarker',x);
if(x.grid>10&&x.position===1)unlock('underdog',x);
}
if(prev&&prev.status==='DNF'&&Number(x.points)>0)unlock('recovery',x);
if(finished.length>=5){const avg=finished.slice(-5).reduce((n,y)=>n+y.position,0)/5;if(x.position<=avg-5)unlock('above',x);}

if(finished.length>=10){const last=finished.slice(-5).reduce((n,y)=>n+y.position,0)/5,prior=finished.slice(-10,-5).reduce((n,y)=>n+y.position,0)/5;if(prior-last>=3)unlock('improver',x);}
if(x.position===1){const n=(winsByCircuit.get(x.event)||0)+1;winsByCircuit.set(x.event,n);if(n>=3)unlock('circuit',x);}
}

if(x.qual<=10&&++topqual===5)unlock('qualgain',x);

}

unlock('untouchable',x);

if(fastest&&fastest.driver===name)unlock('triple',x);
}
prev=x;
}
return unlocked;
}

function rivalryPage(a,b,season){
const rows=DB.results.filter(x=>x.round!==0&&(season==='all'||String(x.season)===season));
const aa=rows.filter(x=>x.driver===a),bb=rows.filter(x=>x.driver===b),byB=new Map(bb.map(x=>[raceId(x),x]));

for(const [x,y] of pairs){if(validQual(x)&&validQual(y)){qt++;if(x.qual<y.qual)aq++;if(y.qual<x.qual)bq++;}if(validFinish(x)&&validFinish(y)){rt++;if(x.position<y.position)ar++;if(y.position<x.position)br++;}}

const head=archiveTable(['Metric',a,b],[['Shared race entries',pairs.length,pairs.length],['Qualifying H2H wins',aq,bq],['Race H2H wins (both classified)',ar,br],['Average qualifying',averagePosition(pairs.map(x=>x[0]),'qual').value,averagePosition(pairs.map(x=>x[1]),'qual').value],['Average race finish',averagePosition(pairs.map(x=>x[0]),'position').value,averagePosition(pairs.map(x=>x[1]),'position').value],['Points in shared races',fmt(points(pairs.map(x=>x[0]))),fmt(points(pairs.map(x=>x[1])))]]);

function teammatePage(name,season){

(names.length?names.map(n=>{const entries=mates.filter(x=>x.driver===n),shared=entries.map(x=>[byId.get(raceId(x)),x]);let qa=0,qb=0,ra=0,rb=0;for(const [x,y] of shared){if(validQual(x)&&validQual(y)){qa+=x.qual<y.qual?1:0;qb+=y.qual<x.qual?1:0;}if(validFinish(x)&&validFinish(y)){ra+=x.position<y.position?1:0;rb+=y.position<x.position?1:0;}}return '<div class="panel"><h2>'+esc(name)+' vs '+navLink(driverUrl(n),n)+'</h2>'+archiveTable(['Comparison',name,n],[['Shared races',shared.length,shared.length],['Qualifying H2H',qa,qb],['Race H2H (both classified)',ra,rb],['Points',shared.reduce((t,p)=>t+(Number(p[0].points)||0),0),shared.reduce((t,p)=>t+(Number(p[1].points)||0),0)],['Average qualifying',averagePosition(shared.map(p=>p[0]),'qual').value,averagePosition(shared.map(p=>p[1]),'qual').value],['Average finish',averagePosition(shared.map(p=>p[0]),'position').value,averagePosition(shared.map(p=>p[1]),'position').value]])+'<p>'+navLink('#rivalry/'+encodeURIComponent(name)+'/'+encodeURIComponent(n)+'/'+season,'Full rivalry and race-by-race breakdown →')+'</p></div>';}).join(''):'<div class="panel"><p>No same-team shared race entries recorded for this selection.</p></div>');

function driverPage(name){

'<div class="panel"><h2>Record at every circuit</h2>'+archiveTable(['Circuit','Entries','Wins','Podiums','Best finish','Average finish','Points'],byCircuit.map(c=>{const a=all.filter(x=>x.event===c),fin=a.filter(x=>x.status==='Finished'&&Number.isFinite(x.position));return [navLink(circuitUrl(c),c),a.length,fin.filter(x=>x.position===1).length,fin.filter(x=>x.position<=3).length,fin.length?Math.min(...fin.map(x=>x.position)):'—',fin.length?(fin.reduce((t,x)=>t+x.position,0)/fin.length).toFixed(1):'—',fmt(a.reduce((t,x)=>t+(Number(x.points)||0),0))]}))+'</div>'+
'<div class="panel"><h2>Complete race history</h2>'+archiveTable(['Race','Team','Grid','Finish','Status','Points'],all.slice().sort((a,b)=>b.season-a.season||b.round-a.round).map(x=>[navLink(raceUrl(x),'S'+x.season+' R'+x.round+' · '+x.event),esc(x.team),x.grid??'—',x.position??'—',esc(x.status),x.points??0]))+'</div>';

function circuitPage(name){

function archiveRoute(){
const parts=decodeURIComponent(location.hash.slice(1)).split('/'),type=parts[0];
if(type==='achievements'&&parts.length===2)return achievementsPage(parts[1]);
if(type==='overtaking'&&parts.length===2)return overtakingPage(parts[1]);
if(type==='rivalry'&&parts.length===4)return rivalryPage(parts[1],parts[2],parts[3]);
if(type==='teammate'&&parts.length===3)return teammatePage(parts[1],parts[2]);
if(type==='metric'&&parts.length===4)return metricPage(parts[1],parts[2],parts[3]);
if(type==='race'&&parts.length===3)return racePage(Number(parts[1]),Number(parts[2]));
if(type==='driver'&&parts.length===2)return driverPage(parts[1]);
if(type==='circuit'&&parts.length===2)return circuitPage(parts[1]);
return null;
}
